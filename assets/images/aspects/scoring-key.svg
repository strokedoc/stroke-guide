<svg xmlns="http://www.w3.org/2000/svg" width="1254" height="1254" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
  <title id="title">ASPECTS and PC-ASPECTS scoring key</title>
  <desc id="desc">Both scores start at ten. ASPECTS subtracts one point for each affected region. PC-ASPECTS subtracts one point for each affected paired region and two points for involvement of the pons or midbrain.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071526"/>
      <stop offset="1" stop-color="#0b2f43"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e7c7b"/>
      <stop offset="1" stop-color="#2ea9a6"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0e5c8a"/>
      <stop offset="1" stop-color="#4b83c3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="1254" height="1254" fill="url(#bg)"/>
  <circle cx="1130" cy="120" r="250" fill="#0e7c7b" opacity=".08"/>
  <circle cx="86" cy="1140" r="300" fill="#0e5c8a" opacity=".10"/>

  <text x="627" y="94" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="56" font-weight="760" text-anchor="middle">ASPECTS SCORING KEY</text>
  <text x="627" y="146" fill="#b9d4e7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" text-anchor="middle">Start at 10 · subtract for regions with early ischaemic change</text>

  <g filter="url(#shadow)">
    <rect x="72" y="205" width="532" height="810" rx="30" fill="#102638" stroke="#2f576c" stroke-width="2"/>
    <rect x="650" y="205" width="532" height="810" rx="30" fill="#102638" stroke="#2f576c" stroke-width="2"/>
  </g>

  <rect x="72" y="205" width="532" height="112" rx="30" fill="url(#teal)"/>
  <path d="M72 287h532v30H72z" fill="url(#teal)"/>
  <text x="110" y="267" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="740">ASPECTS</text>
  <text x="110" y="302" fill="#dff7f6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22">Anterior circulation · 10 regions</text>

  <text x="112" y="376" fill="#9fc8c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">GANGLIONIC LEVEL</text>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29">
    <text x="112" y="430"><tspan font-weight="760">C</tspan><tspan dx="20">Caudate</tspan></text>
    <text x="112" y="482"><tspan font-weight="760">L</tspan><tspan dx="25">Lentiform nucleus</tspan></text>
    <text x="112" y="534"><tspan font-weight="760">IC</tspan><tspan dx="15">Internal capsule</tspan></text>
    <text x="112" y="586"><tspan font-weight="760">I</tspan><tspan dx="31">Insular ribbon</tspan></text>
    <text x="112" y="638"><tspan font-weight="760">M1</tspan><tspan dx="14">Anterior MCA cortex</tspan></text>
    <text x="112" y="690"><tspan font-weight="760">M2</tspan><tspan dx="14">Lateral MCA cortex</tspan></text>
    <text x="112" y="742"><tspan font-weight="760">M3</tspan><tspan dx="14">Posterior MCA cortex</tspan></text>
  </g>
  <text x="112" y="806" fill="#9fc8c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">SUPRAGANGLIONIC LEVEL</text>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29">
    <text x="112" y="860"><tspan font-weight="760">M4</tspan><tspan dx="14">Anterior · superior to M1</tspan></text>
    <text x="112" y="912"><tspan font-weight="760">M5</tspan><tspan dx="14">Lateral · superior to M2</tspan></text>
    <text x="112" y="964"><tspan font-weight="760">M6</tspan><tspan dx="14">Posterior · superior to M3</tspan></text>
  </g>
  <circle cx="558" cy="266" r="29" fill="#fff" opacity=".96"/>
  <text x="558" y="276" fill="#0e7c7b" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29" font-weight="800" text-anchor="middle">−1</text>

  <rect x="650" y="205" width="532" height="112" rx="30" fill="url(#blue)"/>
  <path d="M650 287h532v30H650z" fill="url(#blue)"/>
  <text x="688" y="267" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="43" font-weight="740">PC-ASPECTS</text>
  <text x="688" y="302" fill="#e3eef9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22">Posterior circulation · weighted regions</text>

  <text x="690" y="376" fill="#9fc0df" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">PAIRED REGIONS · 1 EACH SIDE</text>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="29">
    <text x="690" y="438">Left thalamus</text>
    <text x="690" y="490">Right thalamus</text>
    <text x="690" y="542">Left PCA territory</text>
    <text x="690" y="594">Right PCA territory</text>
    <text x="690" y="646">Left cerebellum</text>
    <text x="690" y="698">Right cerebellum</text>
  </g>
  <g fill="#8dd3d1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="27" font-weight="800" text-anchor="end">
    <text x="1138" y="438">−1</text><text x="1138" y="490">−1</text>
    <text x="1138" y="542">−1</text><text x="1138" y="594">−1</text>
    <text x="1138" y="646">−1</text><text x="1138" y="698">−1</text>
  </g>

  <line x1="690" y1="742" x2="1142" y2="742" stroke="#34556c" stroke-width="2"/>
  <text x="690" y="792" fill="#9fc0df" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2">BRAINSTEM · SCORE AS A WHOLE</text>
  <g fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32">
    <text x="690" y="862" font-weight="700">Midbrain</text>
    <text x="690" y="928" font-weight="700">Pons</text>
  </g>
  <g fill="#ffb074" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="32" font-weight="820" text-anchor="end">
    <text x="1138" y="862">−2</text>
    <text x="1138" y="928">−2</text>
  </g>
  <text x="690" y="978" fill="#b9c9d6" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20">Any involvement · regardless of side or extent</text>

  <rect x="72" y="1062" width="1110" height="112" rx="22" fill="#0a1b2a" stroke="#2b465b" stroke-width="2"/>
  <text x="627" y="1110" fill="#fff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="700" text-anchor="middle">10 = no scored early ischaemic change · 0 = all scored territories affected</text>
  <text x="627" y="1150" fill="#9fb2c1" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="20" text-anchor="middle">Educational schematic only · correlate with the full scan and local interpretation protocol</text>
</svg>
