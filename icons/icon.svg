<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Acute Stroke Guide">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d4f73"/>
      <stop offset="0.55" stop-color="#0e6a80"/>
      <stop offset="1" stop-color="#0f8a80"/>
    </linearGradient>
    <linearGradient id="vessel" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b"/>
      <stop offset="1" stop-color="#ffa36b"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <g fill="none" stroke="#ffffff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round">
    <!-- cortex outline, left-facing profile -->
    <path d="M300 118c-42-24-96-16-124 18-38 3-63 34-56 70-27 21-30 62-3 84-9 37 20 70 58 68 12 33 55 47 84 24"
          stroke-opacity="0.97"/>
    <!-- central sulcus / midline -->
    <path d="M259 122v268" stroke-opacity="0.55"/>
    <!-- gyral folds -->
    <path d="M259 176c-25 6-39 24-33 42" stroke-opacity="0.8"/>
    <path d="M259 236c-30 4-52 26-48 50" stroke-opacity="0.8"/>
    <path d="M259 300c-22 5-34 20-30 36" stroke-opacity="0.8"/>
    <path d="M186 154c14 8 20 24 15 38" stroke-opacity="0.55"/>
  </g>

  <!-- vascular tree: ICA rising into MCA branches -->
  <g fill="none" stroke="url(#vessel)" stroke-width="19" stroke-linecap="round" stroke-linejoin="round">
    <path d="M296 424c0-46 6-78 26-104"/>
    <path d="M322 320c22-24 46-34 78-33"/>
    <path d="M322 320c14-32 12-58-4-84"/>
  </g>
  <g fill="none" stroke="url(#vessel)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M368 296c6-22 22-34 44-38"/>
    <path d="M330 254c22-8 42-4 58 10"/>
    <path d="M312 214c-2-22 6-38 24-50"/>
  </g>
</svg>
