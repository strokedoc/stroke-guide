  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

as=\"li\" hint-placeholder-count=\"3\"><li style=\"font-size:15px;line-height:1.55;color:var(--text2)\">{{ li }}<\u002Fli><\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ b.isNote }}\">\n                <div style=\"{{ b.noteStyle }}\">\n                  <div style=\"font-size:14px;font-weight:700;margin-bottom:5px\">{{ b.title }}<\u002Fdiv>\n                  <sc-for list=\"{{ b.items }}\" as=\"p\" hint-placeholder-count=\"2\"><p style=\"font-size:14.5px;line-height:1.55;color:var(--text2);margin-bottom:6px\">{{ p }}<\u002Fp><\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ b.isRecs }}\">\n                <div style=\"display:flex;flex-direction:column;gap:8px\">\n                  <sc-for list=\"{{ b.items }}\" as=\"r\" hint-placeholder-count=\"3\">\n                    <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:7px\">\n                      <div style=\"display:flex;align-items:center;gap:7px\">\n                        <span style=\"{{ r.chipStyle }}\">{{ r.cor }}<\u002Fspan>\n                        <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint)\">{{ r.loe }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"font-size:15px;line-height:1.5;font-weight:600;letter-spacing:-.005em\">{{ r.text }}<\u002Fdiv>\n                      <div style=\"font-size:13.5px;line-height:1.5;color:var(--dim2)\">{{ r.note }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ b.isTable }}\">\n                <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden\">\n                  <sc-for list=\"{{ b.rows }}\" as=\"row\" hint-placeholder-count=\"4\">\n                    <div style=\"padding:12px 15px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:3px\">\n                      <div style=\"font-size:15px;font-weight:600\">{{ row.k }}<\u002Fdiv>\n                      <div style=\"font-size:14px;line-height:1.5;color:var(--dim)\">{{ row.v }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isPathfinder }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border);flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">Pathfinder<\u002Fspan>\n          <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim2)\">{{ pfProgress }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px\">\n          <sc-for list=\"{{ pfResults }}\" as=\"r\" hint-placeholder-count=\"1\">\n            <div style=\"{{ r.cardStyle }}\">\n              <div style=\"display:flex;align-items:center;gap:7px\">\n                <span style=\"{{ r.chipStyle }}\">{{ r.cor }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint)\">{{ r.loe }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:16.5px;line-height:1.45;font-weight:600;letter-spacing:-.01em;margin-top:7px\">{{ r.text }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.5;color:var(--dim);margin-top:5px\">{{ r.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{ pfFields }}\" as=\"f\" hint-placeholder-count=\"8\">\n              <div style=\"display:flex;flex-direction:column;gap:6px\">\n                <label style=\"font-size:13px;font-weight:600;color:var(--dim)\">{{ f.label }}<\u002Flabel>\n                <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ true }}\">\n                  <sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.on }}\" style=\"width:100%;padding:13px 14px;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n                    <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ f.isNumber }}\">\n                  <input type=\"number\" value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.on }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;padding:13px 14px;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.55;color:var(--faint)\">It restates the guideline — it does not weigh this patient's individual risk. Enter core and Tmax &gt;6 s volumes straight off the automated perfusion output.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"padding:12px 20px 26px;border-top:1px solid var(--border);display:flex;gap:10px;flex:0 0 auto\">\n          <div sc-camel-on-click=\"{{ pfReset }}\" style=\"flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:600;color:var(--dim);min-height:48px;cursor:pointer\">Reset<\u002Fdiv>\n          <div style=\"flex:2;background:var(--accent-bg);color:var(--on-accent);border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:600;min-height:48px;cursor:pointer\">Copy result<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isNihss }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">NIHSS<\u002Fspan>\n          <span sc-camel-on-click=\"{{ nihssReset }}\" style=\"margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);cursor:pointer\">Reset<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 20px 12px;flex:0 0 auto\">\n          <div style=\"background:var(--accent-bg);border-radius:22px;padding:18px 20px;color:var(--on-accent);display:flex;align-items:flex-end;gap:16px\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent-dim)\">Total<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:600;line-height:1\">{{ nihssTotal }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding-bottom:6px\"><div style=\"font-size:15px;font-weight:600\">{{ nihssSeverity }}<\u002Fdiv><div style=\"font-size:12.5px;color:var(--on-accent-dim)\">{{ nihssProgress }}<\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 20px 26px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ nihssItems }}\" as=\"it\" hint-placeholder-count=\"15\">\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px 15px;display:flex;flex-direction:column;gap:10px\">\n              <div sc-camel-on-click=\"{{ it.toggle }}\" style=\"display:flex;align-items:center;gap:10px;cursor:pointer\">\n                <span style=\"font-size:15.5px;font-weight:600\">{{ it.label }}<\u002Fspan>\n                <span style=\"{{ it.badgeStyle }}\">{{ it.badge }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ it.open }}\">\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <div style=\"display:flex;gap:6px\">\n                    <sc-for list=\"{{ it.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                      <div sc-camel-on-click=\"{{ o.on }}\" style=\"{{ o.style }}\">{{ o.v }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <p style=\"font-size:13.5px;line-height:1.5;color:var(--dim)\">{{ it.selectedText }}<\u002Fp>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:var(--blue-bg);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;padding:13px 15px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:14px;font-weight:700\">Severity bands<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:var(--text2)\">0 no stroke symptoms · 1–4 minor · 5–15 moderate · 16–20 moderate–severe · 21–42 severe. Bands are conventional descriptors, not treatment thresholds. A low NIHSS with a disabling deficit still warrants thrombolysis.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding:12px 20px 26px;border-top:1px solid var(--border);flex:0 0 auto\">\n          <div style=\"background:var(--accent-bg);color:var(--on-accent);border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:600;min-height:48px;cursor:pointer\">Copy to note<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isAspects }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">ASPECTS<\u002Fspan>\n          <span sc-camel-on-click=\"{{ aspectsReset }}\" style=\"margin-left:auto;font-size:13.5px;font-weight:600;color:var(--accent);cursor:pointer\">Reset<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 20px 12px;flex:0 0 auto\">\n          <div style=\"background:var(--accent-bg);border-radius:22px;padding:18px 20px;color:var(--on-accent);display:flex;align-items:flex-end;gap:16px\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent-dim)\">ASPECTS<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:600;line-height:1\">{{ aspectsScore }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding-bottom:6px;font-size:14px;line-height:1.4\">{{ aspectsBand }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 20px 26px;display:flex;flex-direction:column;gap:14px\">\n          <p style=\"font-size:14.5px;line-height:1.55;color:var(--dim)\">Start at 10 and subtract one point for each region showing early ischaemic change. Tap the regions that are affected.<\u002Fp>\n          <sc-for list=\"{{ aspectsGroups }}\" as=\"g\" hint-placeholder-count=\"2\">\n            <div style=\"display:flex;flex-direction:column;gap:8px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)\">{{ g.head }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ g.items }}\" as=\"r\" hint-placeholder-count=\"7\">\n                  <div sc-camel-on-click=\"{{ r.on }}\" style=\"{{ r.style }}\">{{ r.label }}<\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:0 14px 14px 0;padding:13px 15px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:14px;font-weight:700\">Scoring notes<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:var(--text2)\">Subtract only for clear early ischaemic change, visible on more than one axial cut. ASPECTS applies to the MCA territory only — for posterior circulation use PC-ASPECTS, which the basilar EVT recommendation requires to be ≥6. Reduced density predicts infarction; it is not proof of irreversible tissue loss.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTools }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 12px;flex:0 0 auto\"><h2 style=\"font-size:26px;font-weight:700;letter-spacing:-.02em\">Tools<\u002Fh2><\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 20px 26px;display:flex;flex-direction:column;gap:10px\">\n          <sc-for list=\"{{ toolList }}\" as=\"t\" hint-placeholder-count=\"7\">\n            <div sc-camel-on-click=\"{{ t.on }}\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px 16px;display:flex;align-items:center;gap:14px;min-height:48px;cursor:pointer\" style-hover=\"border-color:var(--border-strong)\">\n              <div style=\"display:flex;flex-direction:column;gap:2px\">\n                <span style=\"font-size:16px;font-weight:600\">{{ t.label }}<\u002Fspan>\n                <span style=\"font-size:13px;color:var(--dim2)\">{{ t.sub }}<\u002Fspan>\n              <\u002Fdiv>\n              <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:600;color:var(--accent)\">{{ t.value }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isDose }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">Dosing &amp; administration<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 20px 26px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;gap:8px\">\n            <div sc-camel-on-click=\"{{ setTnk }}\" style=\"{{ tnkStyle }}\">Tenecteplase 0.25<\u002Fdiv>\n            <div sc-camel-on-click=\"{{ setAlt }}\" style=\"{{ altStyle }}\">Alteplase 0.9<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label style=\"font-size:13px;font-weight:600;color:var(--dim)\">Weight, kg<\u002Flabel>\n            <input type=\"number\" value=\"{{ weight }}\" sc-camel-on-change=\"{{ setWeight }}\" placeholder=\"e.g. 78\" style=\"width:100%;padding:14px;font-size:17px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n          <\u002Fdiv>\n          <div style=\"background:var(--accent-bg);border-radius:22px;padding:18px 20px;color:var(--on-accent);display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent-dim)\">Total dose<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:40px;font-weight:600;line-height:1.05\">{{ doseTotal }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--on-accent-dim);margin-top:4px\">{{ doseNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)\">Tenecteplase — 10 kg weight bands<\u002Fdiv>\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden\">\n              <sc-for list=\"{{ tnkBands }}\" as=\"b\" hint-placeholder-count=\"5\">\n                <div style=\"{{ b.style }}\"><span style=\"font-size:15px;font-weight:600\">{{ b.w }}<\u002Fspan><span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:15px\">{{ b.d }}<\u002Fspan><span style=\"width:74px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:14px;color:var(--dim2)\">{{ b.v }}<\u002Fspan><\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--amber-bg);border-left:4px solid var(--amber);border-radius:0 14px 14px 0;padding:13px 15px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:14px;font-weight:700\">Immediately after giving it<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:var(--text2)\">Admit to an intensive care or stroke unit. Observations every 15 min for 2 h, then every 30 min for 6 h, then hourly until 24 h.<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:var(--text2)\">Severe headache, acute hypertension, nausea, vomiting or a worsening examination → stop the infusion (if alteplase) and get an emergency head CT.<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.55;color:var(--faint)\">Do not delay thrombolysis to obtain an exact weight. With estimated weights, 1-kg-band dosing is not necessarily safer than 10-kg-band dosing. Table 7, 2026 AHA/ASA AIS guideline. Paediatric dosing has not been determined.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isClock }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">Last known well<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 20px 26px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-direction:column;gap:6px\">\n            <label style=\"font-size:13px;font-weight:600;color:var(--dim)\">Last known well (24 h clock)<\u002Flabel>\n            <input type=\"time\" value=\"{{ lkw }}\" sc-camel-on-change=\"{{ setLkw }}\" style=\"width:100%;padding:14px;font-size:17px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ setLkwNow }}\" style=\"background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;font-size:15px;font-weight:600;color:var(--dim);min-height:48px;cursor:pointer\">Set to now<\u002Fdiv>\n          <div style=\"background:var(--accent-bg);border-radius:22px;padding:18px 20px;color:var(--on-accent);display:flex;flex-direction:column;gap:4px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent-dim)\">Elapsed<\u002Fdiv>\n            <div style=\"font-family:'IBM Plex Mono',monospace;font-size:44px;font-weight:600;line-height:1.05\">{{ clockValue }}<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.5;color:var(--on-accent-dim);margin-top:4px\">{{ clockNote }}<\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:12.5px;line-height:1.55;color:var(--faint)\">Uses this device's clock. If the last-known-well time is later than the current time, it is assumed to be yesterday. Always confirm against the EMS record and a collateral history — a wrong LKW is the commonest reason a treatable patient is not treated, and vice versa.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isIch }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">ICH score<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 20px 26px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"background:var(--accent-bg);border-radius:22px;padding:18px 20px;color:var(--on-accent);display:flex;align-items:flex-end;gap:16px\">\n            <div><div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent-dim)\">ICH score<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace;font-size:46px;font-weight:600;line-height:1\">{{ ichScore }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"padding-bottom:6px;font-size:14px;line-height:1.4\">{{ ichMort }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ ichFields }}\" as=\"f\" hint-placeholder-count=\"5\">\n            <div style=\"display:flex;flex-direction:column;gap:6px\">\n              <label style=\"font-size:13px;font-weight:600;color:var(--dim)\">{{ f.label }}<\u002Flabel>\n              <sc-raw-select value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.on }}\" style=\"width:100%;padding:13px 14px;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n                <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"3\"><option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption><\u002Fsc-for>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:var(--red-bg);border-left:4px solid var(--red);border-radius:0 14px 14px 0;padding:13px 15px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:14px;font-weight:700\">Use it to describe, not to decide<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:var(--text2)\">Mortality figures come from a small single-centre derivation cohort in which many patients had care withdrawn — the prediction is partly self-fulfilling. The ICH score should not be used to justify limiting treatment in the first 24 hours.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:15px 16px;display:flex;flex-direction:column;gap:6px\">\n            <div style=\"font-size:15px;font-weight:600\">Estimating volume: ABC/2<\u002Fdiv>\n            <div style=\"font-size:14px;line-height:1.55;color:var(--dim)\">(A × B × C) ÷ 2, in centimetres, gives volume in millilitres. A — greatest diameter on the largest slice; B — perpendicular to A on that slice; C — slices with visible haemorrhage × slice thickness, counting a slice as 1 if &gt;75% of the largest area, 0.5 if 25–75%, 0 if less.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isMrs }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">Modified Rankin Scale<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:6px 20px 26px;display:flex;flex-direction:column;gap:10px\">\n          <p style=\"font-size:14.5px;line-height:1.55;color:var(--dim)\">Prestroke mRS is a formal eligibility criterion for thrombectomy — get it from a collateral history, not a guess.<\u002Fp>\n          <sc-for list=\"{{ mrsRows }}\" as=\"m\" hint-placeholder-count=\"7\">\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;display:flex;gap:12px\">\n              <span style=\"{{ m.dotStyle }}\">{{ m.n }}<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:3px\">\n                <span style=\"font-size:15px;font-weight:600\">{{ m.grade }}<\u002Fspan>\n                <span style=\"font-size:13.5px;line-height:1.5;color:var(--dim)\">{{ m.desc }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:var(--blue-bg);border-left:4px solid var(--accent);border-radius:0 14px 14px 0;padding:13px 15px;display:flex;flex-direction:column;gap:5px\">\n            <div style=\"font-size:14px;font-weight:700\">Getting it right at 3 a.m.<\u002Fdiv>\n            <div style=\"font-size:13.5px;line-height:1.6;color:var(--text2)\">Ask family or EMS: \"Before this stroke, could they walk, dress and manage their own affairs independently?\" Yes → likely mRS 0–2. Then probe specifically about walking aids and who does the shopping — those two questions separate 2 from 3 more reliably than anything else.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isTrials }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 20px 10px;display:flex;align-items:center;gap:12px;flex:0 0 auto\">\n          <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:22px;color:var(--dim);cursor:pointer\">‹<\u002Fspan>\n          <span style=\"font-size:15px;font-weight:600\">Trial library<\u002Fspan>\n          <span style=\"margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim2)\">{{ trialCount }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding:0 20px 10px;flex:0 0 auto\">\n          <input type=\"text\" value=\"{{ trialQuery }}\" sc-camel-on-change=\"{{ setTrialQuery }}\" placeholder=\"Filter — 'tenecteplase', 'basilar', 'large core'…\" style=\"width:100%;padding:13px 14px;font-size:16px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:14px;min-height:48px\">\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:4px 20px 26px;display:flex;flex-direction:column;gap:8px\">\n          <sc-for list=\"{{ trialRows }}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div style=\"background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 15px;display:flex;flex-direction:column;gap:4px\">\n              <div style=\"display:flex;align-items:baseline;gap:8px\">\n                <span style=\"font-size:16px;font-weight:700;letter-spacing:-.01em\">{{ t.name }}<\u002Fspan>\n                <span style=\"font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--faint)\">{{ t.cite }}<\u002Fspan>\n                <span style=\"margin-left:auto;font-size:11.5px;font-weight:600;color:var(--accent)\">{{ t.domain }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.5;color:var(--dim2)\">{{ t.pop }}<\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.5;color:var(--text2)\">{{ t.result }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ isSearch }}\">\n      <div style=\"flex:1;min-height:0;display:flex;flex-direction:column\">\n        <div style=\"padding:8px 16px 12px;flex:0 0 auto\">\n          <div style=\"display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:12px 14px\">\n            <svg sc-camel-view-box=\"0 0 24 24\" style=\"width:19px;height:19px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n            <input type=\"text\" value=\"{{ query }}\" sc-camel-on-change=\"{{ setQuery }}\" placeholder=\"Search the whole guide\" style=\"flex:1;border:0;outline:none;font-size:16px;background:transparent;color:var(--text);min-height:24px\">\n            <span sc-camel-on-click=\"{{ back }}\" style=\"font-size:13.5px;color:var(--dim2);cursor:pointer\">Cancel<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex:1;min-height:0;overflow-y:auto;padding:0 0 26px\">\n          <div style=\"padding:4px 20px 10px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)\">{{ searchCount }}<\u002Fdiv>\n          <sc-for list=\"{{ searchResults }}\" as=\"r\" hint-placeholder-count=\"6\">\n            <div sc-camel-on-click=\"{{ r.on }}\" style=\"padding:14px 20px;border-top:1px solid var(--border-soft);display:flex;flex-direction:column;gap:3px;cursor:pointer\" style-hover=\"background:var(--hover)\">\n              <div style=\"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)\">{{ r.crumb }}<\u002Fdiv>\n              <div style=\"font-size:15.5px;line-height:1.5;color:var(--text2)\">{{ r.snippet }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"display:flex;background:var(--surface);border-top:1px solid var(--border);padding:10px 8px 22px;flex:0 0 auto\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <div sc-camel-on-click=\"{{ t.on }}\" style=\"{{ t.style }}\">\n          <sc-if value=\"{{ t.isHome }}\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4 11 12 4l8 7\"><\u002Fpath><path d=\"M6 10v9h12v-9\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ t.isGuide }}\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M4 6h6M4 12h10M4 18h7\"><\u002Fpath><path d=\"m16 8 4 4-4 4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ t.isTools }}\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><rect x=\"4\" y=\"3\" width=\"16\" height=\"18\" rx=\"3\"><\u002Frect><path d=\"M8 8h8M8 12h8M8 16h4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          <sc-if value=\"{{ t.isSearch }}\"><svg sc-camel-view-box=\"0 0 24 24\" style=\"width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"m20 20-3.5-3.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n          {{ t.label }}\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:980},&quot;bigType&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Legibility&quot;}}\">\nconst CHIP = {\n  '1':   'background:var(--green-bg);color:var(--green);border:1px solid currentColor',\n  '2a':  'background:var(--blue-bg);color:var(--accent);border:1px solid currentColor',\n  '2b':  'background:var(--amber-bg);color:var(--amber);border:1px solid currentColor',\n  '3n':  'background:var(--border-soft);color:var(--dim2);border:1px solid var(--neutral-line)',\n  '3h':  'background:var(--red-bg);color:var(--red);border:1px solid currentColor',\n  'none':'background:var(--border-soft);color:var(--dim2);border:1px solid var(--neutral-line)'\n};\nconst chipStyle = (k) => \"font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em;padding:3px 8px;border-radius:7px;white-space:nowrap;\" + (CHIP[k] || CHIP.none);\nconst corLabel = { '1': 'COR 1', '2a': 'COR 2a', '2b': 'COR 2b', '3n': 'COR 3: No Benefit', '3h': 'COR 3: Harm', 'none': '' };\nconst NOTE = {\n  info:   'background:var(--blue-bg);border-left:4px solid var(--accent)',\n  warn:   'background:var(--amber-bg);border-left:4px solid var(--amber)',\n  danger: 'background:var(--red-bg);border-left:4px solid var(--red)',\n  ok:     'background:var(--green-bg);border-left:4px solid var(--green)'\n};\n\nconst rec = (cor, loe, text, note) => ({ cor, loe, text, note: note || '' });\nconst H = (t) => ({ t: 'h', text: t });\nconst P = (t) => ({ t: 'p', text: t });\nconst SRC = (t) => ({ t: 'src', text: t });\nconst UL = (items) => ({ t: 'ul', items });\nconst NOTEB = (tone, title, items) => ({ t: 'note', tone, title, items });\nconst RECS = (items) => ({ t: 'recs', items });\nconst TBL = (rows) => ({ t: 'table', rows });\n\nconst SECTIONS = [\n  { id: 'prehospital', group: 'Hyperacute pathway', title: 'Prehospital and triage',\n    lede: 'Recognition, prenotification and destination are the three levers.',\n    blocks: [\n      H('Recognition and severity screening'),\n      RECS([\n        rec('1', 'A', 'Prehospital personnel should use a brief stroke assessment tool, including one that screens for large vessel occlusion.'),\n        rec('1', 'B-NR', 'EMS should prenotify the receiving hospital.', 'Reduces in-hospital evaluation times, increases thrombolytic use, decreases mortality.'),\n        rec('2a', 'B-NR', 'Dispatch use of a telephone stroke assessment tool for 9-1-1 callers.', 'Improves early identification, shortens on-scene time, prioritises transport.'),\n        rec('3n', 'B-R', 'Ambulance-initiated remote ischaemic conditioning with a BP cuff.')\n      ]),\n      H('Validated prehospital scales'),\n      P('No prehospital scale is diagnostic. They stratify probability so that transport and prenotification decisions can be made before imaging exists.'),\n      TBL([\n        { k: 'CPSS (Cincinnati)', v: 'Any stroke — facial droop, arm drift, speech. Sensitivity 0.89, specificity 0.69 in the best-quality study (2019 Cochrane review).' },\n        { k: 'LAPSS (Los Angeles)', v: 'Any stroke, with exclusion screen. Mean sensitivity 0.83, specificity 0.93.' },\n        { k: 'RACE, G-FAST, CG-FAST, LAMS, PASS, C-STAT, FAST-PLUS', v: 'Anterior large vessel occlusion. AUC 0.72–0.83 across all eight scales in PRESTO (n=1039, 12% had anterior LVO).' }\n      ]),\n      P('The guideline names these scales as a class rather than endorsing one. RACE >4 is the threshold used in the direct-to-angiography recommendation.'),\n      NOTEB('info', 'Where to take the patient — the 2026 change', ['Earlier guidance was \"nearest thrombolytic-capable facility\". The 2026 guideline now endorses considering the local system\\u2019s characteristics and, in the absence of well-functioning systems with rapid interhospital transfer, direct transport to the nearest EVT-capable hospital. Where rapid transfer works well, drip-and-ship remains appropriate. RACECAT did not settle this question.']),\n      P('Mobile stroke units are now recommended where available: B_PROUD and BEST-MSU show faster thrombolysis and better functional outcomes than conventional EMS. New in 2026.'),\n      SRC('Section 2 (Stroke Systems of Care and Prehospital Management), 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'ed', group: 'Hyperacute pathway', title: 'Emergency department evaluation',\n    lede: 'Speed is the treatment effect. Everything that does not change the next decision can wait.',\n    blocks: [\n      H('Time targets'),\n      TBL([\n        { k: 'Door to brain imaging', v: 'Within 25 minutes. COR 1, B-NR.' },\n        { k: 'Door to needle', v: 'As fast as safely possible. COR 1, A — faster treatment improves functional outcome regardless of NIHSS, in patients with disabling deficits.' },\n        { k: 'Serum creatinine before CTA/CTP', v: 'Do not wait for it. COR 1, B-NR.' },\n        { k: 'Coagulation studies before IVT', v: 'Do not wait, if no reason to suspect an abnormality. COR 2a, B-NR — stop treatment if results later prove abnormal.' },\n        { k: 'Door-in-door-out, when transferring for EVT', v: '≤120 minutes. In a US registry only 27% of transfers achieved it. EMS prenotification shortens it.' }\n      ]),\n      NOTEB('warn', 'The one test that must precede thrombolysis — blood glucose (COR 1, B-NR)', [\n        'Severe hypoglycaemia (typically <50 mg/dL) and severe hyperglycaemia (>400 mg/dL) both mimic stroke. Correct it, then reassess.',\n        'If disabling deficits persist after correction to normoglycaemia, give thrombolysis (COR 1) — abnormal glucose is not a reason to withhold treatment once corrected.'\n      ]),\n      H('Severity measurement'),\n      P('A stroke severity scale — preferably the NIHSS — is recommended at baseline and after reperfusion therapy (COR 1, B-NR). Baseline NIHSS is among the strongest predictors of 30- and 90-day mortality and independence; the 24-hour NIHSS, adjusted for baseline, is the best single predictor of 90-day function.'),\n      P('Known limitations the guideline itself flags: the NIHSS undersamples posterior circulation deficits, carries a left-hemisphere bias, and has only modest interrater reliability. A low NIHSS does not mean a non-disabling stroke.'),\n      H('Consent and shared decision-making'),\n      P('Discuss risks and benefits with the patient or their representative when feasible (COR 1, C-EO). When a patient cannot consent and no representative is immediately available, the guideline states plainly that it is justified to proceed with thrombolysis in an otherwise eligible adult with disabling deficits.'),\n      P('Be prepared to treat bleeding complications and angioedema, which can cause partial airway obstruction (COR 1, B-NR).'),\n      SRC('Sections 2.7, 3.1, 3.2, 4.6.1 of the 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'imaging', group: 'Hyperacute pathway', title: 'Imaging',\n    lede: 'One question at a time: is there blood, is there a target, and is there tissue worth saving.',\n    blocks: [\n      RECS([\n        rec('1', 'A', 'All suspected AIS on arrival: emergent NCCT or MRI.', 'Assess ischaemic burden (ASPECTS) and exclude haemorrhage.'),\n        rec('1', 'B-NR', 'Deciding on IVT within 4.5 h: NCCT alone is sufficient.', 'Do not delay for CTA/MRA or perfusion.'),\n        rec('1', 'A', 'Suspected LVO within 24 h: CT/CTA or MRI/MRA of cervical and intracranial vessels, as rapidly as possible.'),\n        rec('2a', 'A', 'Suspected LVO 6–24 h: adjunctive CTP, DWI–FLAIR, or MR DWI-PWI with automated post-processing, if immediately available.'),\n        rec('2a', 'B-R', 'Unknown onset / wake-up, >4.5 h from LKW but otherwise eligible: DWI–FLAIR mismatch selection.'),\n        rec('2a', 'B-R', 'Unknown onset / wake-up, 4.5–24 h from LKW: CTP or MR DWI-PWI with automated post-processing.')\n      ]),\n      NOTEB('info', 'Direct to angiography suite (DTAS)', [\n        'For prehospital-suspected LVO on a validated severity scale (e.g. RACE >4) who are EVT-eligible, bypassing conventional imaging for flat-panel head CT in the angio suite may be considered (COR 2b, B-R).',\n        'For transferred patients with an established LVO who are EVT-eligible, DTAS without repeat brain imaging may be considered — unless there has been clinical change or transfer delay (COR 2b, B-NR).'\n      ]),\n      NOTEB('warn', '\"Core\" is a prediction, not a fact', ['Reduced NCCT density, DWI abnormality and low CBF estimates are predictors of infarction, not synonyms for irreversible tissue loss. The large-core thrombectomy trials exist precisely because the old equation was wrong. Treat the number as an estimate with an error bar.']),\n      NOTEB('danger', 'Severe hypodensity threshold — SELECT2 exploratory analysis', ['A volume ≥26 mL of severe CT hypodensity (≤26 Hounsfield units) identified patients who derived no functional benefit from thrombectomy and had increased cerebral oedema and hemicraniectomy rates. Exploratory, not a recommendation — but worth measuring before committing a very large core to the angio suite.']),\n      H('Perfusion thresholds you will be asked about'),\n      TBL([\n        { k: 'Ischaemic core', v: 'Relative cerebral blood flow <30% of normal tissue on CTP, or the DWI lesion volume.' },\n        { k: 'Critically hypoperfused tissue (penumbra)', v: 'Tmax >6 s on CTP or PWI.' },\n        { k: 'Mismatch volume / ratio', v: 'Hypoperfused volume minus core volume; hypoperfused volume ÷ core volume.' },\n        { k: 'Target mismatch (DEFUSE 3 / TIMELESS / TRACE-III)', v: 'Ratio ≥1.8, mismatch ≥15 mL, core <70 mL.' },\n        { k: 'EXTEND / HOPE / OPTION profile', v: 'Ratio ≥1.2, mismatch ≥10 mL, core <70 mL (EXTEND, HOPE) or <50 mL (OPTION).' },\n        { k: 'DWI–FLAIR mismatch (WAKE-UP)', v: 'DWI lesion present with no marked corresponding FLAIR change; DWI lesion <⅓ MCA territory.' }\n      ]),\n      SRC('Table 3 and section 3.2, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'thrombolysis', group: 'Hyperacute pathway', title: 'IV thrombolysis: making the decision',\n    lede: 'Within 4.5 hours the question is not \"how high is the NIHSS\" but \"is this deficit disabling for this person\".',\n    blocks: [\n      NOTEB('ok', 'The headline — COR 1', ['In adults with disabling deficits regardless of NIHSS score who are eligible within 4.5 hours, treat as fast as possible with tenecteplase 0.25 mg/kg or alteplase 0.9 mg/kg. NCCT alone is sufficient. Do not delay for CTA, CTP or MRI.']),\n      H('Is the deficit clearly disabling?'),\n      P('The operating question, from Table 4: among patients with NIHSS 0–5, if the observed deficits persist, would they still be able to do basic activities of daily living and/or return to work? Basic ADLs are Bathing/dressing, Ambulating, Toileting, Hygiene and Eating — the BATHE mnemonic.'),\n      TBL([\n        { k: 'Typically clearly disabling', v: 'Complete hemianopsia (vision ≥2) · severe aphasia (language ≥2) · severe hemi-attention or extinction to more than one modality (≥2) · any weakness limiting sustained effort against gravity (motor ≥2).' },\n        { k: 'May not be clearly disabling', v: 'Isolated mild aphasia still communicating meaningfully · isolated facial droop · mild cortical hand weakness · hemisensory loss alone · mild hemimotor or hemisensorimotor loss · mild hemiataxia, still ambulatory.' }\n      ]),\n      P('A deficit disabling for one person may not be for another — lower-limb weakness preventing walking scores only 2 on the NIHSS and is unambiguously disabling.'),\n      NOTEB('danger', 'Non-disabling deficits — COR 3: No Benefit, B-R', ['IVT is not recommended within 4.5 h for mild non-disabling deficits: it has not shown superiority over dual antiplatelet therapy. A 2023 randomised trial found DAPT noninferior to alteplase in minor non-disabling stroke, with more early neurological deterioration and bleeding in the alteplase arm.']),\n      H('Choice of agent'),\n      P('Either alteplase or tenecteplase is endorsed within the 4.5-hour window. Tenecteplase\\u2019s single 5-second bolus, versus a 1-hour infusion, simplifies administration, reduces dosing errors and shortens door-to-needle and door-in-door-out times.'),\n      NOTEB('danger', 'Dose matters', ['Tenecteplase 0.4 mg/kg is the wrong dose in stroke. NOR-TEST 2 was terminated early for worse safety and functional outcomes at 0.4 mg/kg, and an earlier dose-escalation study showed increased sICH. Use 0.25 mg/kg.']),\n      H('Not reasons to withhold or delay'),\n      RECS([\n        rec('1', 'A', 'Early ischaemic change of mild to moderate extent on NCCT — treat.'),\n        rec('1', 'B-NR', 'Patient on single or dual antiplatelet therapy — treat.', 'Absolute sICH increase 0.9% (SAPT) and 1.2% (DAPT), against roughly 8% absolute benefit.'),\n        rec('2a', 'B-NR', 'Awaiting haematology or coagulation results with no reason to suspect abnormality — do not wait.', 'Stop if results return abnormal.'),\n        rec('1', 'B-NR', 'Unknown cerebral microbleed burden — do not obtain MRI first.'),\n        rec('2a', 'B-NR', '1–10 microbleeds known on prior MRI — treatment is reasonable.'),\n        rec('2b', 'B-NR', '>10 microbleeds known on prior MRI — usefulness uncertain; may increase sICH risk.'),\n        rec('2a', 'B-NR', 'Sickle cell disease — IVT can be beneficial without increased sICH or systemic haemorrhage.')\n      ]),\n      H('Adjuncts that do not work'),\n      UL([\n        'Argatroban with IVT — COR 3: No Benefit, A',\n        'Eptifibatide with IVT within 3 h — COR 3: No Benefit, B-R',\n        'Abciximab — COR 3: Harm, B-R (increased bleeding)',\n        'IV aspirin concurrently or within 90 min of starting IVT — COR 3: Harm, B-R',\n        'Aspirin as a substitute for IVT or thrombectomy in an eligible patient — COR 3: Harm, B-R',\n        'Sonothrombolysis — no benefit in NOR-SASS or CLOTBUST-ER'\n      ]),\n      SRC('Sections 4.6.1, 4.6.2, 4.6.5 and Tables 4 and 8, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'contraindications', group: 'Hyperacute pathway', title: 'Thrombolysis contraindications',\n    lede: 'Three tiers, taken directly from Table 8. Very little in the middle tier is a hard stop — most of it is a conversation with a consultant.',\n    blocks: [\n      NOTEB('danger', 'Absolute — do not administer IV thrombolysis', ['These are the conditions the guideline classifies as absolute contraindications.']),\n      TBL([\n        { k: 'CT with extensive hypodensity', v: 'Clear hypodensity appearing responsible for the symptoms — greater than the density of contralateral unaffected white matter.' },\n        { k: 'CT with haemorrhage', v: 'Any acute intracranial haemorrhage.' },\n        { k: 'Moderate–severe TBI <14 days', v: '>30 min unconsciousness, GCS <13, or haemorrhage / contusion / skull fracture on neuroimaging.' },\n        { k: 'Intracranial or spinal surgery <14 days', v: 'Potentially harmful; should not be administered.' },\n        { k: 'Acute spinal cord injury within 3 months', v: 'Likely contraindicated.' },\n        { k: 'Intra-axial intracranial neoplasm', v: 'Potentially harmful; should not be administered.' },\n        { k: 'Infective endocarditis', v: 'Should not be administered.' },\n        { k: 'Severe coagulopathy or thrombocytopenia', v: 'Platelets <100 000/mm³, INR >1.7, aPTT >40 s, or PT >15 s. Without recent warfarin or heparin, treatment may start before results are back — discontinue if abnormal.' },\n        { k: 'Aortic arch dissection', v: 'Known or suspected — potentially harmful.' },\n        { k: 'ARIA / amyloid immunotherapy', v: 'Risk of thrombolysis-related ICH is unknown; IVT should be avoided.' }\n      ]),\n      NOTEB('warn', 'Relative — individualised risk–benefit, usually with a consultant', ['Weigh the severity and disability of the presenting stroke against the bleeding risk. For a severe, clearly disabling deficit, benefit generally outweighs risk.']),\n      TBL([\n        { k: 'DOAC exposure <48 h', v: 'Safety unknown. Emerging observational data suggest IVT may be considered after a thorough individual analysis — weigh timing of the last dose, renal function, stroke severity, EVT availability, reversal-agent availability and DOAC-specific assays. Record all of it.' },\n        { k: 'Pre-existing disability or frailty', v: 'Benefits vs risks uncertain; determine on an individual basis.' },\n        { k: 'Ischaemic stroke within 3 months', v: 'May increase ICH risk. Weigh timing and size of the prior stroke.' },\n        { k: 'Prior ICH', v: 'Known amyloid angiopathy carries higher risk than ICH from a modifiable cause such as hypertension or coagulopathy.' },\n        { k: 'Major non-CNS trauma 14 days–3 months; major non-CNS surgery <10 days', v: 'Risk of serious systemic haemorrhage requiring transfusion. Surgical consultation.' },\n        { k: 'GI or GU bleeding within 21 days', v: 'GI/GU consultation to establish whether the bleeding has been treated and the risk modified.' },\n        { k: 'STEMI within 3 months; acute pericarditis; left atrial or ventricular thrombus', v: 'Emergent cardiology consultation. For concurrent AIS and acute STEMI, dose for cerebral ischaemia.' },\n        { k: 'Systemic active malignancy', v: 'Safety unknown. Emergent oncology consultation.' },\n        { k: 'Pregnancy and post-partum', v: 'May be considered when benefit of treating moderate or severe stroke outweighs uterine bleeding risk. Emergent obstetric consultation.' },\n        { k: 'Dural puncture within 7 days; arterial puncture of a noncompressible vessel within 7 days', v: 'May be considered on an individual basis; safety unknown.' },\n        { k: 'Intracranial arterial dissection; unruptured untreated vascular malformation', v: 'Safety unknown.' }\n      ]),\n      NOTEB('ok', 'Benefit usually exceeds risk', ['Diagnostic uncertainty (possible mimic — haemorrhagic transformation risk about 0.5%), sickle cell disease, antiplatelet therapy, early ischaemic change on NCCT, menstruation, recent lumbar puncture in selected cases. Unless there is an absolute contraindication, benefit likely outweighs risk.']),\n      SRC('Table 8, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'extended', group: 'Hyperacute pathway', title: 'Extended-window thrombolysis',\n    lede: 'Beyond 4.5 hours the clock is replaced by tissue. Selection is by mismatch, and the strength of the recommendation falls as the window widens.',\n    blocks: [\n      RECS([\n        rec('2a', 'B-R', 'Unknown time of onset, within 4.5 h of symptom recognition, DWI lesion <⅓ MCA territory with no marked FLAIR change.', 'IVT can be beneficial (WAKE-UP).'),\n        rec('2a', 'B-R', '4.5–9 h from LKW, or waking within 9 h of the sleep midpoint, with salvageable penumbra on automated perfusion imaging.', 'IVT may be reasonable (EXTEND, ECASS-4).'),\n        rec('2b', 'B-R', '4.5–24 h, LVO with salvageable penumbra, who cannot receive EVT.', 'IVT directed by clinicians with expertise in thrombolytic stroke care may be beneficial (TRACE-III, HOPE).')\n      ]),\n      NOTEB('warn', 'If thrombectomy is available, thrombectomy wins', ['The 4.5–24 h thrombolysis recommendation is explicitly for patients who cannot receive EVT. In TIMELESS, tenecteplase did not improve outcomes over placebo in patients undergoing EVT in that window. Do not delay thrombectomy to observe the response to a late thrombolytic.']),\n      H('Trials in the 4.5–24 hour window'),\n      TBL([\n        { k: 'TRACE-III · NEJM 2024, n=516', v: 'ICA/M1–M2 LVO, no planned EVT, mismatch ratio >1.8. Tenecteplase. mRS 0–1 33.0% vs 24.2% (RR 1.37). sICH 3.0% vs 0.8%.' },\n        { k: 'HOPE · JAMA 2025;334:788, n=372', v: 'Any AIS with perfusion mismatch, no initial plan for EVT. Alteplase. mRS 0–1 40.3% vs 26.3% (adjusted RR 1.52, 1.14–2.02). sICH 3.8% vs 0.51%.' },\n        { k: 'OPTION · JAMA 2026, n=566 (post-guideline)', v: 'Non-LVO, core <50 mL, ratio ≥1.2, 4.5–24 h. Tenecteplase. mRS 0–1 43.6% vs 34.2% (RR 1.28, 1.04–1.57). sICH 2.8% vs 0%.' },\n        { k: 'EXTEND · NEJM 2019, n=225', v: 'Mixed, 4.5–9 h, perfusion mismatch. Alteplase. mRS 0–1 35.4% vs 29.5% (adjusted RR 1.44). sICH 6.2% vs 0.9%.' }\n      ]),\n      NOTEB('info', 'Reading OPTION honestly', [\n        'OPTION was published after the guideline\\u2019s literature cut-off and carries no class of recommendation. It is a single open-label trial conducted entirely in China, with blinded endpoint assessment.',\n        'It is the first randomised evidence for late thrombolysis in non-LVO stroke, and the effect size is modest: NNT ≈ 11 for an excellent outcome, against an absolute sICH increase of 2.8% from a baseline of zero. Whether to act on it before it appears in a guideline is a local governance decision, not a lookup.'\n      ]),\n      NOTEB('danger', 'A safety signal worth knowing', ['Where NCCT hypodensity is larger than the perfusion-defined core, the mismatch is internally inconsistent and sICH risk is higher. Read the plain CT alongside the perfusion maps rather than trusting the automated output alone. All standard contraindications apply unchanged in the extended window.']),\n      SRC('Section 4.6.3 and Table 3, 2026 AHA/ASA AIS guideline; OPTION doi:10.1001/jama.2026.0210; HOPE doi:10.1001/jama.2025.12063.')\n    ] },\n\n  { id: 'evt', group: 'Hyperacute pathway', title: 'Mechanical thrombectomy',\n    lede: 'The recommendations are organised by window, then by ASPECTS. Age and prestroke mRS sit inside specific rows — read the row you are actually in.',\n    blocks: [\n      H('Anterior circulation: ICA or M1 — all rows require
