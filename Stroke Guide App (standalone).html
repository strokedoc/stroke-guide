ents. Two Chinese RCTs found EVT alone noninferior; four others failed to confirm superiority or noninferiority of EVT alone, favouring combined therapy. No trial showed increased sICH from adding IVT.',\n        'Do not delay EVT after thrombolysis to assess for clinical improvement.'\n      ]),\n      H('Technique'),\n      RECS([\n        rec('1', 'A', 'Stent retrievers, contact aspiration, or combination techniques — all recommended to achieve rapid adequate reperfusion.'),\n        rec('1', 'A', 'Reperfusion to eTICI 2b/2c/3, as early as possible within the therapeutic window.'),\n        rec('1', 'B-R', 'Either general anaesthesia or procedural sedation.'),\n        rec('2b', 'B-R', 'Proximal balloon guide catheters — benefit uncertain.')\n      ]),\n      NOTEB('warn', 'Set expectations before you consent the family', ['Across the large-core trials, 19.5% of EVT patients achieved functional independence and 36.5% independent ambulation — against 7.5% functional independence with medical therapy alone. That is a genuine doubling, and a long way from the ~50% independence of the small-core era. NNT to prevent one additional instance of functional dependence is 8. A discussion with the patient and family, where feasible, is essential in this population.']),\n      SRC('Sections 4.7.1–4.7.4, 2026 AHA/ASA AIS guideline; Liu C, et al. Neurology 2025;104:e213443.')\n    ] },\n\n  { id: 'post', group: 'After reperfusion', title: 'Monitoring and blood pressure',\n    lede: 'The clearest negative message in 2026: more intensive blood-pressure lowering does not help after thrombolysis, and harms after thrombectomy.',\n    blocks: [\n      H('Targets at a glance'),\n      RECS([\n        rec('1', 'B-NR', 'Before IVT: lower to SBP <185 and DBP <110 before starting.'),\n        rec('2a', 'B-NR', 'Before EVT with no IVT: reasonable to maintain ≤185/110.'),\n        rec('1', 'B-R', 'First 24 h after IVT: maintain <180/105.'),\n        rec('2a', 'B-NR', 'During and 24 h after EVT: reasonable to maintain ≤180/105.'),\n        rec('3n', 'B-R', 'After IVT in mild–moderate stroke: intensive SBP <140 is not recommended.'),\n        rec('3h', 'A', 'After successful EVT (mTICI 2b/2c/3, anterior circulation): intensive SBP <140 for the first 72 h is harmful.')\n      ]),\n      NOTEB('danger', 'Complete reperfusion does not license a lower target', ['Intensive systolic lowering to <140 mmHg is not recommended even in the setting of complete reperfusion (TICI 3). The instinct to protect a freshly reperfused brain by dropping the pressure is the exact behaviour the trials found harmful.']),\n      H('Neither IVT nor EVT given'),\n      TBL([\n        { k: 'BP <220/120, no comorbid indication', v: 'Initiating or restarting antihypertensives in the first 48–72 h is not effective to prevent death or dependency (COR 3: No Benefit, A). Around 75% lower spontaneously within days.' },\n        { k: 'BP ≥220/120, no comorbid indication', v: 'Benefit of treating within 48–72 h uncertain (COR 2b). Reduction still generally advised; aim for an initial reduction of about 15%.' },\n        { k: 'Comorbid condition demanding BP control', v: 'Acute coronary event, acute heart failure, aortic dissection, post-thrombolysis sICH, pre-eclampsia — early treatment is indicated (COR 1).' },\n        { k: 'Hypotension and hypovolaemia', v: 'Correct, to maintain systemic perfusion sufficient for organ function (COR 1, C-LD).' }\n      ]),\n      NOTEB('info', 'Getting under 185/110 before the bolus', ['The guideline sets targets but does not mandate an agent. In practice short-acting titratable IV agents are used — labetalol, nicardipine and clevidipine are the ones most commonly stocked. The principle is smooth, sustained control rather than a rapid overshoot.']),\n      NOTEB('warn', 'Observations after thrombolysis', [\n        'Every 15 min for 2 h → every 30 min for 6 h → hourly until 24 h. Increase frequency if SBP >180 or DBP >105.',\n        'Admit to intensive care or a stroke unit. Delay nasogastric tubes, indwelling catheters and arterial lines where safe. Repeat CT or MRI at 24 h before starting any antiplatelet or anticoagulant.',\n        'Severe headache · acute hypertension · nausea or vomiting · any worsening of the examination → stop the infusion and get an emergency head CT.'\n      ]),\n      SRC('Section 4.3 and Table 7, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'complications-ivt', group: 'After reperfusion', title: 'Bleeding and angioedema',\n    lede: 'Two protocols worth knowing before you need them, both reproduced from the guideline.',\n    blocks: [\n      H('Symptomatic intracranial bleeding within 24 h of IVT'),\n      UL([\n        'Stop the alteplase infusion, or the tenecteplase push if still in progress.',\n        'Emergent labs: CBC, PT (INR), aPTT, fibrinogen, type and cross-match.',\n        'Emergent non-enhanced head CT if there is clinical concern.',\n        'Cryoprecipitate: 10 units over 10–30 min, to maintain fibrinogen ≥150 mg/dL (10 units raises fibrinogen by roughly 50 mg/dL).',\n        'Antifibrinolytic: tranexamic acid 1000 mg IV over 10 min, or ε-aminocaproic acid 4–5 g over 1 h then 1 g IV until bleeding is controlled.',\n        'Consult haematology and neurosurgery as necessary.',\n        'Supportive therapy: blood pressure, ICP, CPP, MAP, temperature and glucose control.'\n      ]),\n      NOTEB('danger', 'Orolingual angioedema — airway first', [\n        'Intubation may not be necessary if oedema is limited to the anterior tongue and lips. Oedema involving the larynx, palate, floor of mouth or oropharynx, or rapid progression within 30 minutes, carries a much higher risk of needing an airway.',\n        'Awake fibreoptic intubation is optimal. Nasotracheal intubation risks epistaxis after a thrombolytic; cricothyroidotomy is rarely needed and equally problematic.'\n      ]),\n      UL([\n        'Discontinue the thrombolytic infusion (if alteplase) and hold ACE inhibitors.',\n        'Methylprednisolone 125 mg IV.',\n        'Diphenhydramine 50 mg IV.',\n        'Ranitidine 50 mg IV or famotidine 20 mg IV.',\n        'If angioedema continues to increase: epinephrine 0.1% (1 mg/mL) 0.3 mL subcutaneously, or nebulised 0.5 mg.',\n        'Icatibant 30 mg subcutaneously into the abdomen; may repeat 6-hourly to a maximum of 3 injections in 24 h.',\n        'Plasma-derived C1 esterase inhibitor 20 IU/kg has been used successfully.'\n      ]),\n      SRC('Tables 5 and 6, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'supportive', group: 'Ward & ICU', title: 'General supportive care',\n    lede: 'Most of the outcome gain on the ward comes from avoiding harm rather than adding treatment.',\n    blocks: [\n      RECS([\n        rec('1', 'C-LD', 'Decreased consciousness or bulbar dysfunction: airway support and ventilatory assistance as needed.'),\n        rec('1', 'C-LD', 'In hypoxia, supplemental oxygen to maintain SpO₂ >94%.', 'Supplemental oxygen is for hypoxia. There is no recommendation to give it to a normoxic patient.'),\n        rec('2b', 'B-R', 'Normobaric hyperoxia before EVT — within 6 h, NIHSS 10–20, ASPECTS ≥6, anterior LVO — may be reasonable.'),\n        rec('3n', 'B-R', 'Routine 0-degree head positioning versus 30 degrees for 24 h — no benefit (HeadPoST).'),\n        rec('3n', 'B-R', 'Routine Trendelenburg versus 0–30 degrees — no benefit (HOPES-2).')\n      ]),\n      SRC('Section 5, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'antithrombotics', group: 'Ward & ICU', title: 'Antithrombotics and early prevention',\n    lede: 'Aspirin, DAPT within its evidence, and when to start the DOAC in atrial fibrillation.',\n    blocks: [\n      H('Aspirin'),\n      RECS([\n        rec('1', 'A', 'Aspirin within 48 h of stroke onset, to reduce death and dependency.'),\n        rec('2b', 'B-NR', 'Antiplatelet therapy in the first 24 h after IVT — risk uncertain.', 'Might be considered where a concomitant condition makes such treatment substantially beneficial, or withholding it substantially risky.'),\n        rec('1', 'A', 'Antiplatelet in preference to oral anticoagulation for noncardioembolic AIS or TIA.')\n      ]),\n      H('Dual antiplatelet therapy'),\n      RECS([\n        rec('1', 'A', 'Minor stroke NIHSS ≤3 or high-risk TIA (ABCD² ≥4), not given IVT: aspirin + clopidogrel with a loading dose, started within 24 h, continued 21 days, then single antiplatelet.'),\n        rec('2a', 'B-R', 'NIHSS ≤5 or high-risk TIA within 24–72 h, presumed atherosclerotic: aspirin + clopidogrel for 21 days (INSPIRES).'),\n        rec('2b', 'B-R', 'NIHSS ≤5 or high-risk TIA (ABCD² ≥6) within 24 h: ticagrelor with loading dose + aspirin for 30 days (THALES).'),\n        rec('2a', 'B-NR', 'Severe (70–99%) symptomatic intracranial stenosis: aspirin 325 mg + clopidogrel 75 mg for up to 90 days with intensive risk-factor management — the SAMMPRIS medical protocol.')\n      ]),\n      NOTEB('warn', 'Two failure modes the guideline calls out', [\n        'Continuing DAPT beyond 90 days does not reduce recurrent stroke and increases bleeding.',\n        'DAPT is routinely used outside its evidence. In the READAPT cohort of 1070 patients, 32.2% started DAPT late (>24 h), 63.2% never received a clopidogrel loading dose, and only 7.8% actually met the trial criteria.'\n      ]),\n      H('Atrial fibrillation: when to start the DOAC'),\n      P('Four randomised trials (TIMING, ELAN, OPTIMAS, START) and the CATALYST patient-level meta-analysis have replaced the old \"1-3-6-12 day\" habit. Early initiation within 4 days reduced the 30-day composite (2.1% vs 3.0%, OR 0.70) with identical sICH (0.4% in both groups). Untreated, recurrence runs at roughly 0.5–1.3% per day in the first two weeks.'),\n      TBL([\n        { k: 'TIA, no infarct on imaging', v: 'As soon as possible.' },\n        { k: 'Minor infarct — <1.5 cm, or no visible infarct', v: 'Within 48 h (ELAN early arm).' },\n        { k: 'Moderate infarct — >1.5 cm anterior circulation', v: 'Within 48 h (ELAN early arm).' },\n        { k: 'Major infarct — entire MCA or ACA territory', v: 'Day 6–7; ≤4 days defensible (OPTIMAS found no interaction with infarct volume).' },\n        { k: 'Petechial haemorrhagic transformation (HI1/HI2)', v: 'Does not mandate delay — treat by infarct size as above.' },\n        { k: 'Parenchymal haematoma type 1', v: 'Individualise. OPTIMAS included PH1 at ≤4 days without excess sICH.' },\n        { k: 'PH2 or haemorrhage remote from the infarct', v: 'Delay ~12–28 days; repeat imaging to confirm stability. Excluded from every timing trial — expert framework only.' }\n      ]),\n      NOTEB('warn', 'Edges of the evidence', [\n        'Very severe stroke (NIHSS >20) was under-represented in all four trials — median NIHSS was 3–6.5. The trials tested DOACs only.',\n        'Do not bridge with heparin. Parenteral anticoagulation within 48 h increases haemorrhagic transformation without preventing recurrence.'\n      ]),\n      H('What not to use'),\n      UL([\n        'Ticagrelor over aspirin as monotherapy in minor stroke / high-risk TIA — COR 3: No Benefit',\n        'Triple therapy (aspirin + clopidogrel + dipyridamole) — COR 3: Harm, increased bleeding',\n        'Adding an antiplatelet to oral anticoagulation in stroke with AF, absent active CAD or a recent stent — COR 3: Harm'\n      ]),\n      SRC('Sections 4.8, 4.9 and Table 9, 2026 AHA/ASA AIS guideline; CATALYST doi:10.1016/S0140-6736(25)00439-8.')\n    ] },\n\n  { id: 'complications', group: 'Ward & ICU', title: 'Swelling, surgery and seizures',\n    lede: 'Anticipate malignant oedema early; the surgical decisions are time-critical and largely age-dependent.',\n    blocks: [\n      RECS([\n        rec('1', 'C-EO', 'In large cerebral or cerebellar infarction, hold an early discussion of care options and likely outcomes with the patient and family.'),\n        rec('1', 'C-LD', 'Early transfer to an institution with neurosurgical and critical care expertise for those at increased risk of malignant swelling.'),\n        rec('2a', 'C-LD', 'Osmotic therapy (mannitol or hypertonic saline) is reasonable as a bridge to surgery in neurological decline from swelling.'),\n        rec('3n', 'B-R', 'IV glibenclamide in large hemispheric infarction age 18–70 — does not improve functional outcome (CHARM).'),\n        rec('3h', 'C-LD', 'Hypothermia, barbiturates or corticosteroids for swelling — should not be administered.')\n      ]),\n      H('Decompressive craniectomy'),\n      RECS([\n        rec('1', 'A', 'Age ≤60, unilateral MCA infarction, deterioration within 48 h from swelling despite medical therapy: craniectomy with dural expansion is beneficial.'),\n        rec('2b', 'B-R', 'Age >60, same scenario: may be considered to reduce mortality — survival benefit but not improved functional outcome.'),\n        rec('2a', 'B-NR', 'Decreased level of consciousness attributed to brain swelling is a reasonable trigger for surgery.')\n      ]),\n      H('Cerebellar infarction'),\n      RECS([\n        rec('1', 'C-LD', 'Obstructive hydrocephalus: ventriculostomy, to improve neurological function and decrease mortality.'),\n        rec('1', 'B-NR', 'Deterioration from brainstem compression, or infarct volume ≥35 mL: decompressive suboccipital craniectomy with dural expansion should be performed.')\n      ]),\n      NOTEB('warn', 'The trap', ['A cerebellar infarct that looks small on the initial CT can obstruct the fourth ventricle two days later. Upward herniation is a real but manageable risk of ventriculostomy alone. Identify these patients early and get surgical consultation — this often means early transfer.']),\n      H('Seizures'),\n      RECS([\n        rec('1', 'C-LD', 'After an unprovoked post-stroke seizure, antiseizure medication chosen on patient-specific characteristics.'),\n        rec('3n', 'C-LD', 'Prophylactic antiseizure medication to prevent seizures or improve outcome — no benefit.')\n      ]),\n      SRC('Sections 6.1–6.5, 2026 AHA/ASA AIS guideline.')\n    ] },\n\n  { id: 'dissection', group: 'Ward & ICU', title: 'Cervical artery dissection',\n    lede: 'A leading cause of stroke in young adults. Most recurrent ischaemia happens in the first days.',\n    blocks: [\n      NOTEB('warn', 'Different source document', ['This section draws on the 2024 AHA Scientific Statement on cervical artery dissection (Yaghi et al) — suggestions, not a guideline with COR/LOE — plus the trials and STOP-CAD. Where the 2026 AIS guideline speaks, its class labels are shown.']),\n      H('Suspect it, then confirm it'),\n      P('Image the cervical vessels urgently (CTA, or MRI with MRA) for headache or neck pain with ischaemic symptoms or a partial Horner syndrome. If CTA is negative but suspicion persists, fat-suppressed MRI shows the mural haematoma. DSA is not first-line. Mimics worth knowing: carotid web, fenestration, pseudo-occlusion, artefact.'),\n      H('Acute reperfusion is not altered by the dissection'),\n      UL([\n        'Thrombolysis in extracranial dissection within 4.5 h is reasonably safe and probably recommended. Intracranial dissection: safety unknown — relative contraindication.',\n        'Thrombectomy is reasonable in otherwise eligible patients.',\n        'Acute stenting of the dissected segment is controversial — no functional benefit shown; reserve it for true haemodynamic compromise.'\n      ]),\n      H('Antiplatelet or anticoagulant'),\n      TBL([\n        { k: 'High ischaemic risk, low bleeding risk', v: 'Intraluminal thrombus, occlusive dissection or high-grade stenosis → anticoagulation. In STOP-CAD\\u2019s occlusive subgroup, anticoagulation was associated with less ischaemic stroke (aHR 0.40, 0.18–0.88).' },\n        { k: 'High bleeding risk', v: 'Large infarct, haemorrhagic transformation, or intradural extension → antiplatelet. Monotherapy, or a short DAPT course with a loading dose.' },\n        { k: 'Neither profile', v: 'Either is defensible — individualise and decide with the patient.' }\n      ]),\n      UL([\n        'Duration 3–6 months (2026 AIS guideline: ≥3 months, COR 2a, B-R).',\n        'If anticoagulation is chosen, switch to an antiplatelet before 6 months — in STOP-CAD major haemorrhage rose sharply by day 180 (aHR 5.56) with no late ischaemic advantage.',\n        'Start immediately once haemorrhage is excluded: in TREAT-CAD, 5 of the 7 ischaemic strokes in the aspirin arm occurred on day 1.',\n        'DOACs were not tested in the trials (VKA in both); observational data suggest they are a reasonable substitute.'\n      ]),\n      SRC('Yaghi S, et al. Stroke 2024;55:e91–e106; STOP-CAD doi:10.1161/STROKEAHA.123.045731.')\n    ] },\n\n  { id: 'ich', group: 'Haemorrhagic stroke', title: 'Spontaneous intracerebral haemorrhage',\n    lede: 'Haematoma expansion happens in the first hours and predicts death. Everything acute is aimed at that window: pressure, reversal, and a surgical decision.',\n    blocks: [\n      NOTEB('warn', 'Different source document', [\n        'This section is not from the 2026 AIS guideline. It draws on the 2022 AHA/ASA ICH guideline (doi:10.1161/STR.0000000000000407) plus named trials published since.',\n        'The 2022 guideline sits behind a paywall, so the class and level labels here were taken from published summaries rather than the source document. Treat the specific COR/LOE labels as second-hand.'\n      ]),\n      H('The first hour'),\n      UL([\n        'Airway, GCS, NIHSS. Note the exact time of onset and the last dose of any anticoagulant.',\n        'Non-contrast CT — volume by ABC/2, intraventricular extension, location (lobar vs deep), midline shift.',\n        'Blood pressure — start lowering within 2 hours, reach target within 1 hour.',\n        'Reverse the anticoagulant — the single most time-critical drug decision.',\n        'Neurosurgical consultation for cerebellar haemorrhage, hydrocephalus, intraventricular extension, or a lobar haematoma of 30–80 mL.',\n        'Avoid early prognostication. Do not withdraw care in the first 24 hours; early do-not-resuscitate orders are an independent predictor of death.'\n      ]),\n      H('Blood pressure'),\n      RECS([\n        rec('2b', 'B-R', 'Mild–moderate ICH presenting with SBP 150–220: acute lowering to a target of 140, maintained 130–150, is safe and may be reasonable.'),\n        rec('2a', 'C-LD', 'Initiate treatment within 2 h of onset and reach target within 1 h.'),\n        rec('2a', 'C-LD', 'Careful titration to smooth, sustained control — avoiding peaks and large variability — can be beneficial.'),\n        rec('3h', 'B-R', 'Mild–moderate ICH with SBP >150: lowering SBP to <130 is potentially harmful.')\n      ]),\n      NOTEB('ok', 'INTERACT3 — the bundle beats any single component', ['A stepped-wedge cluster-randomised trial across 121 hospitals in 10 countries (n=7036) tested a goal-directed care bundle: intensive SBP lowering to <140, glucose control, temperature ≤37.5 °C, and reversal of warfarin to INR <1.5, each within 1 hour. Poor functional outcome fell (common OR 0.86, 0.76–0.97, P=0.015) with fewer serious adverse events (16.0% vs 20.1%).']),\n      H('Glucose, temperature, seizures, VTE'),\n      TBL([\n        { k: 'Glucose', v: 'Monitor and treat hypoglycaemia (COR 1); treat moderate–severe hyperglycaemia >180–200 mg/dL (COR 2a).' },\n        { k: 'Temperature', v: 'Avoid elevated temperatures; efficacy of therapeutic hypothermia unclear (COR 2b).' },\n        { k: 'Seizures', v: 'Clinical or electrographic seizures — antiseizure medication recommended (COR 1). Prophylaxis without seizures — not beneficial (COR 3).' },\n        { k: 'VTE', v: 'Intermittent pneumatic compression starting on the day of diagnosis (COR 1, B-R). Low-dose UFH or LMWH at 24–48 h may be reasonable (COR 2b).' }\n      ]),\n      H('Surgery'),\n      TBL([\n        { k: 'Cerebellar haemorrhage with deterioration, brainstem compression, or hydrocephalus', v: 'Immediate surgical evacuation, with or without EVD (COR 1). The clearest surgical indication in ICH.' },\n        { k: 'Hydrocephalus with decreased level of consciousness', v: 'Ventricular drainage is recommended (COR 1, B-NR).' },\n        { k: 'Lobar haematoma 30–80 mL within 24 h', v: 'ENRICH (NEJM 2024, n=300): minimally invasive evacuation improved the utility-weighted mRS at 180 days (0.458 vs 0.374). Benefit confined to lobar. 30-day mortality 9.3% vs 18.0%.' },\n        { k: 'Deep / basal ganglia haemorrhage', v: 'No trial has shown functional benefit from evacuation, including the basal ganglia stratum of ENRICH.' }\n      ]),\n      SRC('2022 AHA/ASA ICH guideline; INTERACT3 doi:10.1016/S0140-6736(23)00806-1; ENRICH doi:10.1056/NEJMoa2404603.')\n    ] },\n\n  { id: 'reversal', group: 'Haemorrhagic stroke', title: 'Anticoagulation reversal',\n    lede: 'Establish the agent and the time of the last dose first. That pair determines everything below.',\n    blocks: [\n      RECS([\n        rec('1', 'B-R', 'Warfarin / VKA, INR ≥2.0: 4-factor PCC (25–50 units/kg per product label) plus vitamin K 10 mg IV.', 'Vitamin K directly after factor replacement — PCC works in minutes, vitamin K sustains the correction. Give both.'),\n        rec('2a', 'B-NR', 'Dabigatran: idarucizumab 5 g IV (2 × 2.5 g).', 'Activated PCC or PCC may be considered if idarucizumab is unavailable (COR 2b). Dabigatran is dialysable.'),\n        rec('2a', 'B-NR', 'Apixaban, rivaroxaban, edoxaban: andexanet alfa.', 'Low dose 400 mg bolus then 480 mg over 2 h if last dose ≥8 h earlier or apixaban ≤5 mg / rivaroxaban ≤10 mg; high dose 800 mg then 960 mg otherwise. 4-factor or activated PCC if andexanet is unavailable (COR 2b).'),\n        rec('2a', 'C-LD', 'Unfractionated heparin: protamine sulfate.'),\n        rec('2b', 'C-LD', 'LMWH: protamine — partial reversal only; neutralises anti-IIa but only partially anti-Xa.'),\n        rec('none', 'Table 5', 'Thrombolytic-associated ICH: cryoprecipitate ± antifibrinolytic.', 'See the post-thrombolysis bleeding protocol.')\n      ]),\n      NOTEB('danger', 'Do not transfuse platelets reflexively', [\n        'In aspirin-treated ICH not undergoing emergency neurosurgery, platelet transfusion is potentially harmful and should not be administered (COR 3: Harm, B-R) — the PATCH trial found worse outcomes with transfusion.',\n        'Where emergency neurosurgery is planned, transfusion might be considered to reduce postoperative bleeding (COR 2b). The effectiveness of desmopressin is uncertain (COR 2b).'\n      ]),\n      H('Andexanet alfa: what ANNEXA-I showed'),\n      UL([\n        'Haemostatic efficacy 67.0% vs 53.1% (adjusted difference 13.4 points, 4.6–22.2, P=0.003)',\n        'Median reduction in anti-Xa activity 94.5% vs 26.9% (P<0.001)',\n        'Thrombotic events 10.3% vs 5.6% (P=0.048) — ischaemic stroke 6.5% vs 1.5%',\n        'No appreciable difference in modified Rankin score or 30-day death'\n      ]),\n      P('Andexanet controls the haematoma better than usual care, at the cost of a real thrombotic signal, and without a demonstrated functional benefit. That trade-off belongs in the decision, not underneath it.'),\n      NOTEB('info', 'Restarting anticoagulation afterwards', ['A separate decision, made days later, weighing the indication (mechanical valve > AF), the ICH location (lobar and probable amyloid angiopathy carry higher rebleeding risk than deep hypertensive ICH), and the patient\\u2019s overall trajectory. Involve stroke neurology and cardiology.']),\n      SRC('2022 AHA/ASA ICH guideline; ANNEXA-I doi:10.1056/NEJMoa2313040. Confirm all doses against your local formulary before administration.')\n    ] },\n\n  { id: 'evidence', group: 'Reference', title: 'How to read COR and LOE',\n    lede: 'Every recommendation carries the class and level of evidence assigned by the writing committee. They mean specific things.',\n    blocks: [\n      TBL([\n        { k: 'COR 1 — Strong', v: 'Benefit greatly outweighs risk. \"is recommended\", \"should be performed\", \"is indicated\".' },\n        { k: 'COR 2a — Moderate', v: 'Benefit outweighs risk. \"is reasonable\", \"can be useful\", \"can be beneficial\".' },\n        { k: 'COR 2b — Weak', v: 'Benefit is greater than or equal to risk. \"may be reasonable\", \"might be considered\", \"usefulness is not well established\".' },\n        { k: 'COR 3: No Benefit', v: 'Benefit equals risk — moderate or strong evidence of no effect. \"is not recommended\", \"is not useful\".' },\n        { k: 'COR 3: Harm', v: 'Risk exceeds benefit. \"is potentially harmful\", \"should not be performed\".' },\n        { k: 'LOE A', v: 'High-quality evidence from more than one randomised trial, or meta-analyses of high-quality RCTs.' },\n        { k: 'LOE B-R / B-NR', v: 'Moderate-quality evidence from randomised trials / from well-designed nonrandomised or observational studies.' },\n        { k: 'LOE C-LD / C-EO', v: 'Limited data, or expert opinion based on clinical experience.' }\n      ]),\n      NOTEB('warn', 'Two habits worth keeping', [\n        'A Class 3 is a real recommendation. \"3: No Benefit\" and \"3: Harm\" carry the same strength as a Class 1 — they are strong recommendations to not do something.',\n        'Read the whole row, not the chip. A COR 1 recommendation qualified by \"age <80, prestroke mRS 0–1, ASPECTS 3–5, no significant mass effect\" is Class 1 for that population, and silent about anyone else.'\n      ]),\n      SRC('Guidelines define practices meeting the needs of patients in most, but not all, circumstances, and do not replace clinical judgement.')\n    ] }\n];\n\nconst NIHSS_ITEMS = [\n  { k: '1a', label: '1a. Level of consciousness', opts: [[0, 'Alert, keenly responsive'], [1, 'Not alert, arousable by minor stimulation to obey, answer or respond'], [2, 'Not alert, requires repeated or painful stimulation to make movements'], [3, 'Responds only with reflex motor or autonomic effects, or is s'], [1, 'Drift — falls by 5 seconds but does not hit the bed'], [2, 'Some effort against gravity — falls to the bed by 5 seconds'], [3, 'No effort against gravity — falls immediately'], [4, 'No movement'], ['UN', 'Amputation or joint fusion — untestable, not scored']] },\n  { k: '6b', label: '6b. Motor leg — right', opts: [[0, 'No drift — holds 30° for the full 5 seconds'], [1, 'Drift — falls by 5 seconds but does not hit the bed'], [2, 'Some effort against gravity — falls to the bed'], [3, 'No effort against gravity — falls immediately'], [4, 'No movement'], ['UN', 'Amputation or joint fusion — untestable, not scored']] },\n  { k: '7', label: '7. Limb ataxia', opts: [[0, 'Absent'], [1, 'Present in one limb'], [2, 'Present in two limbs']] },\n  { k: '8', label: '8. Sensory', opts: [[0, 'Normal — no sensory loss'], [1, 'Mild to moderate loss — pinprick less sharp or dull on the affected side'], [2, 'Severe to total loss — not aware of being touched in face, arm and leg']] },\n  { k: '9', label: '9. Best language', opts: [[0, 'No aphasia'], [1, 'Mild to moderate aphasia — some loss of fluency or comprehension'], [2, 'Severe aphasia — fragmentary expression, listener must infer and probe'], [3, 'Mute or global aphasia — no usable speech or auditory comprehension']] },\n  { k: '10', label: '10. Dysarthria', opts: [[0, 'Normal'], [1, 'Mild to moderate — slurs at least some words'], [2, 'Severe — speech so slurred as to be unintelligible'], ['UN', 'Intubated or other physical barrier — untestable, not scored']] },\n  { k: '11', label: '11. Extinction and inattention', opts: [[0, 'No abnormality'], [1, 'Inattention or extinction to bilateral simultaneous stimulation in one modality'], [2, 'Profound hemi-inattention or extinction to more than one modality']] }\n];\n\nconst ASPECTS_GROUPS = [\n  { head: 'Ganglionic level', items: [['C', 'Caudate'], ['L', 'Lentiform'], ['IC', 'Internal capsule'], ['I', 'Insular ribbon'], ['M1', 'Anterior MCA cortex'], ['M2', 'Lateral MCA cor mbolysis contraindications', options: [['', 'Select…'], ['none', 'None identified'], ['relative', 'Relative only'], ['absolute', 'At least one absolute']] },\n  { k: 'occl', label: 'Occlusion on CTA/MRA', options: [['', 'Select…'], ['noneg', 'No occlusion on CTA/MRA'], ['notdone', 'Vascular imaging not done'], ['lvo', 'ICA or M1'], ['m2', 'Proximal M2 (dominant)'], ['basilar', 'Basilar'], ['nonlvo', 'Medium / distal vessel']] },\n  { k: 'aspects', label: 'ASPECTS', options: [['', 'Select…'], ['6-10', '6–10'], ['3-5', '3–5'], ['0-2', '0–2']] },\n  { k: 'mrs', label: 'Prestroke mRS', options: [['', 'Select…'], ['0-1', '0–1'], ['2', '2'], ['3-4', '3–4'], ['5', '5']] },\n  { k: 'age', label: 'Age', options: [['', 'Select…'], ['u80', 'Under 80'], ['80plus', '80 or older']] },\n  { k: 'nihss', label: 'NIHSS, if scored (optional)', number: true, placeholder: 'e.g. 14' }\n];\n\nclass Component extends DCLogic {\n  state = {\n    theme: 'light',\n    screen: 'home', prev: 'home', sectionId: null,\n    nihss: {}, nihssOpen: null, aspects: [],\n    agent: 'tnk', weight: '', lkw: '',\n    ich: { gcs: '0', vol: '0', ivh: '0', inf: '0', age: '0' },\n    pf: {}, query: '', trialQuery: ''\n  };\n\n  componentDidMount() { document.body.dataset.theme = this.state.theme; }\n  componentDidUpdate() { document.body.dataset.theme = this.state.theme; }\n  toggleTheme = () => this.setState((s) => ({ theme: s.theme === 'dark' ? 'light' : 'dark' }));\n\n  go = (screen) => this.setState((s) => ({ screen, prev: s.screen === screen ? s.prev : s.screen }));\n  back = () => this.setState((s) => ({ screen: s.prev === s.screen ? 'home' : s.prev, prev: 'home' }));\n\n  nihssTotal() {\n    return NIHSS_ITEMS.reduce((sum, it) => {\n      const v = this.state.nihss[it.k];\n      return sum + (typeof v === 'number' ? v : 0);\n    }, 0);\n  }\n  aspectsScore() { return 10 - this.state.aspects.length; }\n  ichTotal() {\n    const i = this.state.ich;\n    return ['gcs', 'vol', 'ivh', 'inf', 'age'].reduce((a, k) => a + Number(i[k] || 0), 0);\n  }\n  doseCalc() {\n    const w = parseFloat(this.state.weight);\n    if (!w || w <= 0) return { total: '—', note: this.state.agent === 'tnk' ? 'Tenecteplase 0.25 mg/kg, maximum 25 mg. Single IV bolus over 5–10 seconds.' : 'Alteplase 0.9 mg/kg, maximum 90 mg. 10% as a bolus over 1 minute, then the remainder over 60 minutes.' };\n    if (this.state.agent === 'tnk') {\n      const d = Math.min(w * 0.25, 25);\n      return { total: d.toFixed(1) + ' mg', note: 'Single IV bolus over 5–10 seconds' + (w * 0.25 > 25 ? ' — capped at the 25 mg maximum.' : '.') + ' At 5 mg/mL that is ' + (d / 5).toFixed(1) + ' mL.' };\n    }\n    const d = Math.min(w * 0.9, 90);\n    return { total: d.toFixed(1) + ' mg', note: 'Bolus ' + (d * 0.1).toFixed(1) + ' mg over 1 minute, then ' + (d * 0.9).toFixed(1) + ' mg infused over 60 minutes' + (w * 0.9 > 90 ? ' — capped at the 90 mg maximum.' : '.') };\n  }\n  clock() {\n    if (!this.state.lkw) return { value: '—', note: 'Set the last-known-well time to start the clock.' };\n    const parts = this.state.lkw.split(':');\n    const now = new Date();\n    const t = new Date(now); t.setHours(Number(parts[0]), Number(parts[1]), 0, 0);\n    if (t > now) t.setDate(t.getDate() - 1);\n    const mins = Math.round((now - t) / 60000);\n    const h = Math.floor(mins / 60), m = mins % 60;\n    let note;\n    if (mins <= 270) note = 'Within 4.5 h — IV thrombolysis window for a disabling deficit.';\n    else if (mins <= 360) note = '4.5–6 h — thrombectomy window; thrombolysis only on perfusion selection.';\n    else if (mins <= 1440) note = '6–24 h — thrombectomy by ASPECTS; extended-window IVT only if EVT is unavailable.';\n    else note = 'Beyond 24 h — outside every reperfusion recommendation.';\n    return { value: h + ':' + String(m).padStart(2, '0'), note };\n  }\n  pfResults() {\n    const p = this.state.pf, out = [];\n    if (p.ich === 'yes') {\n      out.push({ cor: 'none', loe: '', text: 'Haemorrhage on NCCT — th
